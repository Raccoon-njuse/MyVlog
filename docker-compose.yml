services:
  postgres:
    image: postgres:16-alpine
    container_name: myvlog-postgres
    environment:
      POSTGRES_DB: myvlog
      POSTGRES_USER: myvlog
      POSTGRES_PASSWORD: myvlog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myvlog -d myvlog"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
