<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频播放测试</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f5e'/%3E%3Cpath d='M9 17c4-6 10-6 14 0' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='12' r='2' fill='white'/%3E%3Ccircle cx='20' cy='12' r='2' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://vjs.zencdn.net/8.23.3/video-js.css">
  <link rel="stylesheet" href="/test.css">
</head>
<body class="test-page">
  <main class="test-shell">
    <header class="test-header">
      <div>
        <span class="test-kicker">播放诊断</span>
        <h1>所有视频</h1>
        <p id="testSummary">正在加载视频...</p>
      </div>
      <div class="test-actions">
        <a class="button" href="/">返回总览</a>
        <button type="button" class="primary" id="reloadButton">刷新并绕过缓存</button>
      </div>
    </header>

    <section class="test-status" aria-live="polite">
      <span>缓存戳</span>
      <strong id="cacheToken">-</strong>
      <span id="playerStatus">Video.js 加载中</span>
    </section>

    <section class="test-layout">
      <div class="test-video-list" id="videoList"></div>
      <aside class="test-log-panel">
        <header>
          <h2>播放事件</h2>
          <button type="button" id="clearLogButton">清空</button>
        </header>
        <pre id="eventLog"></pre>
      </aside>
    </section>
  </main>

  <script src="https://vjs.zencdn.net/8.23.3/video.min.js"></script>
  <script src="/test.js"></script>
</body>
</html>
